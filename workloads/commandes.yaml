apiVersion: apps/v1
kind: Deployment
metadata:
  name: commandes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commandes
  template:
    metadata:
      labels:
        app: commandes
    spec:
      containers:
        - name: commandes
          image: docker.io/library/cloudshop-commandes:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: commandes
spec:
  type: ClusterIP
  selector:
    app: commandes
  ports:
    - port: 8080
      targetPort: 8080
